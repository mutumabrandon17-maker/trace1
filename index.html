<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/1063/1063376.png">
    <title>trace 1 - Biometric Face Recognition</title>

    <!-- Real Biometric Face Recognition Library (TensorFlow.js backend) -->
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #e5e7eb;
            min-height: 100vh;
        }

        .app {
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */
        .sidebar {
            width: 250px;
            background: #111827;
            border-right: 1px solid #1f2937;
            padding: 24px 16px;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }

        .sidebar h2 {
            font-size: 1.25rem;
            color: #38bdf8;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-btn {
            width: 100%;
            padding: 12px;
            margin-bottom: 8px;
            background: transparent;
            border: 1px solid transparent;
            color: #9ca3af;
            text-align: left;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .nav-btn:hover, .nav-btn.active {
            background: #1e293b;
            color: #38bdf8;
            border-color: #334155;
        }

        /* MAIN CONTENT AREA */
        .main-content {
            margin-left: 250px;
            flex: 1;
            padding: 32px;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .card h3 {
            margin-bottom: 16px;
            color: #f8fafc;
        }

        /* INPUTS & BUTTONS */
        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #fff;
            outline: none;
        }

        .btn {
            background: #0284c7;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #0369a1;
        }

        /* CCTV & BIOMETRIC CANVAS CONTAINER */
        .video-container {
            position: relative;
            width: 100%;
            max-width: 720px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            margin-top: 16px;
        }

        video {
            width: 100%;
            display: block;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .status-box {
            margin-top: 12px;
            padding: 10px;
            background: #0f172a;
            border-radius: 4px;
            font-family: monospace;
            color: #38bdf8;
            font-size: 0.9rem;
        }

        /* MATCH RESULTS CARD */
        .match-card {
            display: flex;
            gap: 16px;
            align-items: center;
            background: #0f172a;
            border: 1px solid #0284c7;
            padding: 16px;
            border-radius: 6px;
            margin-top: 16px;
        }

        .match-card img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #38bdf8;
        }

        .confidence {
            color: #4ade80;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="app">
        <!-- NAVIGATION SIDEBAR -->
        <div class="sidebar">
            <h2>Trace 1</h2>
            <button class="nav-btn active" onclick="switchTab('cctvTab', this)">Biometric Scanner</button>
            <button class="nav-btn" onclick="switchTab('databaseTab', this)">Person Database</button>
        </div>

        <!-- MAIN CONTENT AREA -->
        <div class="main-content">
            <!-- BIOMETRIC CCTV SCANNER TAB -->
            <div id="cctvTab" class="section active">
                <div class="card">
                    <h3>Real-Time Biometric Video Scanner</h3>
                    <p style="color: #94a3b8; font-size: 0.9rem;">
                        Upload a video file containing clear faces. The AI scanner detects facial landmarks in real time and computes 128-d biometric signatures to match against the person database.
                    </p>
                    
                    <div class="input-group" style="margin-top: 16px;">
                        <label>Select CCTV Video File</label>
                        <input type="file" id="videoInput" accept="video/*" onchange="loadVideo(event)">
                    </div>

                    <div class="video-container">
                        <video id="cctvVideo" controls onplay="startBiometricTracking()"></video>
                        <canvas id="cctvCanvas"></canvas>
                    </div>

                    <div class="status-box" id="analysisStatus">Initializing Biometric Engine...</div>

                    <button class="btn" style="margin-top: 16px;" onclick="runDemoAnalysis()">Match Frame Against Database</button>

                    <div id="matchResults"></div>
                </div>
            </div>

            <!-- DATABASE TAB -->
            <div id="databaseTab" class="section">
                <div class="card">
                    <h3>Register Person Profile</h3>
                    <div class="input-group">
                        <label>Full Name</label>
                        <input type="text" id="personName" placeholder="e.g. John Doe">
                    </div>
                    <div class="input-group">
                        <label>ID / Card Number</label>
                        <input type="text" id="cardId" placeholder="e.g. ID-90210">
                    </div>
                    <div class="input-group">
                        <label>Station / Class</label>
                        <input type="text" id="station" placeholder="e.g. Station A">
                    </div>
                    <div class="input-group">
                        <label>Clear Face Photo</label>
                        <input type="file" id="personPhoto" accept="image/*">
                    </div>
                    <button class="btn" onclick="addPerson()">Save Biometric Record</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Tab Switcher
        function switchTab(tabId, btn) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        // Mock/Local Storage Database
        let people = JSON.parse(localStorage.getItem('trace_people') || '[]');

        function addPerson() {
            const name = document.getElementById('personName').value;
            const cardId = document.getElementById('cardId').value;
            const station = document.getElementById('station').value;
            const photoInput = document.getElementById('personPhoto');

            if (!name || !photoInput.files[0]) {
                alert('Please fill name and provide a face photo.');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                people.push({
                    name: name,
                    cardId: cardId,
                    station: station,
                    photo: e.target.result
                });
                localStorage.setItem('trace_people', JSON.stringify(people));
                alert('Person registered successfully.');
                document.getElementById('personName').value = '';
                document.getElementById('cardId').value = '';
                document.getElementById('station').value = '';
                photoInput.value = '';
            };
            reader.readAsDataURL(photoInput.files[0]);
        }

        function escapeHTML(str) {
            return str ? str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            ) : '';
        }

        // BIOMETRIC RECOGNITION ENGINE
        let faceModelsLoaded = false;

        async function loadBiometricModels() {
            const status = document.getElementById("analysisStatus");
            status.textContent = "Loading biometric AI models (SSD MobileNet V1 & Landmark68)...";

            try {
                // Pre-trained face recognition weights hosted on GitHub CDN
                const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';
                await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
                await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
                await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);

                faceModelsLoaded = true;
                status.textContent = "Biometric AI models loaded. Upload video to begin tracking.";
            } catch (err) {
                status.textContent = "Error loading AI models. Ensure internet connection is active.";
                console.error(err);
            }
        }
        window.addEventListener('DOMContentLoaded', loadBiometricModels);

        function loadVideo(event) {
            const file = event.target.files[0];
            if (!file) return;

            const video = document.getElementById("cctvVideo");
            video.src = URL.createObjectURL(file);
        }

        async function startBiometricTracking() {
            if (!faceModelsLoaded) return;

            const video = document.getElementById("cctvVideo");
            const canvas = document.getElementById("cctvCanvas");

            const displaySize = { width: video.clientWidth, height: video.clientHeight };
            faceapi.matchDimensions(canvas, displaySize);

            setInterval(async () => {
                if (video.paused || video.ended) return;

                // Detect faces, extract 68 landmarks, compute 128-d descriptor vectors
                const detections = await faceapi.detectAllFaces(video)
                    .withFaceLandmarks()
                    .withFaceDescriptors();

                const resizedDetections = faceapi.resizeResults(detections, displaySize);

                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Draw bounding box & facial mesh over video stream
                faceapi.draw.drawDetections(canvas, resizedDetections);
                faceapi.draw.drawFaceLandmarks(canvas, resizedDetections);
            }, 100);
        }

        async function runDemoAnalysis() {
            const status = document.getElementById("analysisStatus");
            const results = document.getElementById("matchResults");
            results.innerHTML = "";

            if (!people || people.length === 0) {
                status.textContent = "No profiles found in database. Register a person first.";
                return;
            }

            status.textContent = "Scanning frame for biometric facial features...";

            const video = document.getElementById("cctvVideo");
            const videoDetection = await faceapi.detectSingleFace(video)
                .withFaceLandmarks()
                .withFaceDescriptor();

            if (!videoDetection) {
                status.textContent = "No visible face detected in current frame. Pause video on a clear face.";
                return;
            }

            status.textContent = "Comparing 128-dimensional biometric vectors against database...";

            let bestMatch = null;
            let lowestDistance = 1.0; // Distance thresholds < 0.6 indicate match

            for (const person of people) {
                if (!person.photo) continue;

                const img = await faceapi.fetchImage(person.photo);
                const dbDetection = await faceapi.detectSingleFace(img)
                    .withFaceLandmarks()
                    .withFaceDescriptor();

                if (dbDetection) {
                    // Compute Euclidean Distance between facial descriptor vectors
                    const distance = faceapi.euclideanDistance(videoDetection.descriptor, dbDetection.descriptor);
                    if (distance < lowestDistance) {
                        lowestDistance = distance;
                        bestMatch = { person, distance };
                    }
                }
            }

            if (bestMatch && lowestDistance < 0.6) {
                const matchPercent = Math.round((1 - lowestDistance) * 100);
                status.textContent = `Biometric match identified! Match Confidence: ${matchPercent}%`;

                results.innerHTML = `
                    <div class="match-card">
                        ${bestMatch.person.photo ? `<img src="${bestMatch.person.photo}">` : ``}
                        <div>
                            <strong style="color: #38bdf8;">Biometric Identity Match</strong>
                            <p style="margin-top: 4px;">Name: ${escapeHTML(bestMatch.person.name)}</p>
                            <p style="color: #94a3b8; margin-top: 2px;">ID: ${escapeHTML(bestMatch.person.cardId)}</p>
                            <p style="color: #94a3b8; margin-top: 2px;">Station/Class: ${escapeHTML(bestMatch.person.station)}</p>
                            <p class="confidence" style="margin-top: 6px;">Biometric Distance: ${lowestDistance.toFixed(3)} (${matchPercent}% Match)</p>
                        </div>
                    </div>
                `;
            } else {
                status.textContent = "Biometric comparison complete: No matching profile found in database.";
            }
        }
    </script>
</body>

</html>
